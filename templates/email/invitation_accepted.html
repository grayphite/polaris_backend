<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Aceito</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    table { border-collapse: collapse !important; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f7fafc; }
  </style>
</head>
<body style="background-color:#f7fafc;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center" style="padding: 24px;">
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width:600px;background:#ffffff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.06);overflow:hidden;">
          <tr>
            <td align="center" style="background: linear-gradient(135deg, #38a169 0%, #2f855a 100%); padding: 32px 24px;">
              <div style="font-size:26px; color:#ffffff; font-weight:700;">Convite Aceito</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#2d3748;">
              <h2 style="margin:0 0 10px 0; font-size:20px; font-weight:600; color:#2d3748;">Tudo pronto! 🎉</h2>
              <p style="margin:0; color:#4a5568; font-size:15px; line-height:1.7;">
                <strong>${invited_user_name}</strong> aceitou seu convite para a equipe
                <strong style="color:#2b6cb0;">${team_name}</strong> no POLARIS.
              </p>

              <table width="100%" cellpadding="0" cellspacing="0" style="margin-top:20px;background:#f7fafc;border:1px solid #edf2f7;border-radius:8px;">
                <tr>
                  <td style="padding:16px 20px; font-size:14px; color:#4a5568;">
                    <div style="margin:6px 0;"><strong>Membro:</strong> ${invited_user_name}</div>
                    <div style="margin:6px 0;"><strong>Equipe:</strong> ${team_name}</div>
                  </td>
                </tr>
              </table>

              <p style="margin-top:18px;color:#718096;font-size:13px;line-height:1.6;">Acesse sua conta para gerenciar os membros da equipe e começar a colaborar.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="background:#f7fafc;border-top:1px solid #edf2f7;padding:16px; color:#a0aec0; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px;">
              © ${current_year} POLARIS
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
